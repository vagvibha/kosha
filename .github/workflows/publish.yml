name: Sync and publish

on:
  workflow_dispatch:            # "Run workflow" button: sync from Sheets now
  schedule:
    - cron: "23 10 * * *"       # daily, about 3:23 am Pacific
  push:
    branches: [main]            # script or data changes pushed by hand

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download tabs from Google Sheets
        if: github.event_name != 'push'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth requests
          python scripts/sync_sheets.py

      - name: Commit changed data
        if: github.event_name != 'push'
        run: |
          git config user.name "sheets-sync"
          git config user.email "sheets-sync@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Sync data from Google Sheets"
            git push
          fi

      - name: Build site and report
        run: |
          python scripts/build_site.py data -o site
          {
            echo '### Build report'
            echo '```'
            head -n 40 site/report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
