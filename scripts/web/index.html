<!doctype html>
<html lang="sa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=__V__">
</head>
<body>
<header>
  <h1>Concept Tree</h1>
  <div class="searchbox">
    <input id="q" type="search" placeholder="Search nodes, concepts, arthas, words, dhātus…" autocomplete="off" spellcheck="false">
    <div id="results" hidden></div>
  </div>
  <button id="random" title="Open a random concept">Random</button>
  <button id="collapse" title="Collapse the tree">Collapse all</button>
  <a id="reportlink" href="report.txt" target="_blank" rel="noopener">Report</a>
</header>
<main>
  <nav id="tree" aria-label="Concept tree"></nav>
  <div id="split" title="Drag to resize · double-click to reset"></div>
  <aside id="panel" aria-label="Details">
    <button id="closepanel" aria-label="Close details">×</button>
    <div id="recent"></div>
    <div id="card"></div>
  </aside>
</main>
<script src="data/core.js?v=__V__"></script>
<script>window.CT_COMM_URL = "data/comm.js?v=__V__";</script>
<script src="app.js?v=__V__"></script>
</body>
</html>
